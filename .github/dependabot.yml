version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:00"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
    groups:
      development-tooling:
        dependency-type: development
      runtime-dependencies:
        dependency-type: production
    ignore:
      # Keep compiler/runtime type majors deliberate. In particular,
      # typescript-eslint must declare support before TypeScript majors move.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "08:30"
      timezone: Australia/Sydney
    open-pull-requests-limit: 10
