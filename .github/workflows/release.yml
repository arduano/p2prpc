name: Version packages

on:
  push:
    branches: [main]

concurrency:
  group: changesets-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Open or update release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies without undeclared lifecycle scripts
        run: npm ci --strict-allow-scripts
      - name: Validate release candidate
        run: npm run typecheck && npm run lint && npm test && npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Build and validate the packed package
        shell: bash
        run: |
          npm run pack:artifact -- "$RUNNER_TEMP/package-artifact"
          tarball="$(jq -er '.[0].filename' "$RUNNER_TEMP/package-artifact/pack.json")"
          artifact="$RUNNER_TEMP/package-artifact/$tarball"
          npm run check:package-content -- "$artifact" "$RUNNER_TEMP/package-artifact/pack.json"
          npm run check:package-publint -- "$artifact"
          npm run check:package-types -- "$artifact"
          npm run test:packed -- "$artifact"
      - name: Open or update Changesets release pull request
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
