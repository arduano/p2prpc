name: Version packages

on:
  push:
    branches: [main]

concurrency:
  group: changesets-main
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  version:
    name: Open or update release pull request
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: write
      contents: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate release candidate
        run: npm run typecheck && npm run lint && npm test && npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Inspect package contents
        run: npm pack --dry-run -w @p2prpc/core
      - name: Open or update Changesets release pull request
        id: changesets
        uses: changesets/action@8488615a623b1b9c987934bb89eae8af6a946ac1 # v2.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Approve release pull request validation
        if: steps.changesets.outputs.has-changesets == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_PR: ${{ steps.changesets.outputs.pr-number }}
        run: |
          [[ "$RELEASE_PR" =~ ^[0-9]+$ ]] || { echo "Changesets did not return a pull request number" >&2; exit 1; }
          head_sha="$(gh pr view "$RELEASE_PR" --json headRefOid --jq .headRefOid)"
          [[ "$head_sha" =~ ^[0-9a-f]{40}$ ]] || { echo "Release pull request has an invalid head SHA" >&2; exit 1; }
          expected_paths='[".github/workflows/ci.yml", ".github/workflows/codeql.yml", ".github/workflows/dependency-review.yml"]'
          deadline=$((SECONDS + 60))
          while (( SECONDS < deadline )); do
            runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?event=pull_request&head_sha=${head_sha}&per_page=100")"
            run_count="$(jq -r --argjson paths "$expected_paths" '
              [.workflow_runs[] | select(.path as $path | $paths | index($path)) | .path]
              | unique
              | length
            ' <<<"$runs")"
            if (( run_count >= 3 )); then
              for run_id in $(jq -r --argjson paths "$expected_paths" '
                .workflow_runs[]
                | select(.conclusion == "action_required" and (.path as $path | $paths | index($path)))
                | .id
              ' <<<"$runs"); do
                gh api --method POST "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/approve"
              done
              exit 0
            fi
            sleep 2
          done
          echo "Expected three release validation workflows for $head_sha; found $run_count" >&2
          exit 1
