name: Publish GitHub Package

on:
  push:
    tags:
      - "v*"

concurrency:
  group: github-packages-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  candidate:
    name: Validate immutable release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      actions: read
      contents: read
    outputs:
      ci-run-id: ${{ steps.ci.outputs.run-id }}
      version: ${{ steps.package.outputs.version }}
    steps:
      - name: Check out tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies without undeclared lifecycle scripts
        run: npm ci --strict-allow-scripts
      - name: Verify exact semver tag
        run: npm run check:release-tag -- "$GITHUB_REF"
      - name: Validate GitHub Actions workflows
        run: bash scripts/check-github-actions.sh
      - name: Verify exact main-branch CI gate
        id: ci
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          runs="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?branch=main&event=push&status=success&per_page=100")"
          run_id="$(jq -er --arg sha "$GITHUB_SHA" '
            [.workflow_runs[] |
              select(
                .head_sha == $sha and
                .status == "completed" and
                .conclusion == "success" and
                .event == "push" and
                .head_branch == "main" and
                .path == ".github/workflows/ci.yml"
              )][0].id
          ' <<< "$runs")" || {
            echo "No successful main-branch CI run exists for tagged commit $GITHUB_SHA" >&2
            exit 1
          }
          run="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
          jq -e --arg sha "$GITHUB_SHA" '
            select(
              .head_sha == $sha and
              .head_branch == "main" and
              .event == "push" and
              .path == ".github/workflows/ci.yml" and
              .status == "completed" and
              .conclusion == "success"
            )
          ' <<< "$run" >/dev/null
          echo "run-id=$run_id" >> "$GITHUB_OUTPUT"
      - name: Validate source and native integration
        run: >-
          npm run lint &&
          npm run typecheck &&
          npm test &&
          npm run test:integration &&
          npm run build &&
          npm run check:docs &&
          npm run docs:build
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Read package version
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build and verify exact release artifact
        shell: bash
        env:
          CI_RUN_ID: ${{ steps.ci.outputs.run-id }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          npm run pack:artifact -- release-artifact
          tarball="$(jq -er '.[0].filename' release-artifact/pack.json)"
          artifact="release-artifact/$tarball"
          npm run check:package-content -- "$artifact" release-artifact/pack.json
          npm run check:package-publint -- "$artifact"
          npm run check:package-types -- "$artifact"
          npm run test:packed -- "$artifact"
          npm run test:tree-shaken-native -- "$artifact"
          npm run generate:release-sbom -- \
            "$artifact" \
            release-artifact/sbom.cdx.json \
            release-artifact/registry-signatures.json
          integrity="$(jq -er '.[0].integrity' release-artifact/pack.json)"
          sha256="$(sha256sum "$artifact" | awk '{ print $1 }')"
          dist_tag=latest
          if [[ "$RELEASE_VERSION" == *-* ]]; then dist_tag=next; fi
          jq -n \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg version "$RELEASE_VERSION" \
            --arg tarball "$tarball" \
            --arg integrity "$integrity" \
            --arg sha256 "$sha256" \
            --arg distTag "$dist_tag" \
            --arg ciRunId "$CI_RUN_ID" \
            '{
              schemaVersion: 3,
              package: "@arduano/p2prpc-core",
              commit: $commit,
              distTag: $distTag,
              ref: $ref,
              version: $version,
              tarball: $tarball,
              integrity: $integrity,
              sha256: $sha256,
              ciRunId: $ciRunId
            }' > release-artifact/manifest.json
          (
            cd release-artifact
            sha256sum \
              "$tarball" \
              manifest.json \
              pack.json \
              sbom.cdx.json \
              registry-signatures.json \
              > SHA256SUMS
          )
      - name: Upload immutable release candidate
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2prpc-release-candidate-${{ github.sha }}
          path: release-artifact/
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  publish:
    name: Publish exact GitHub Package
    needs: candidate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: github-packages
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
      packages: write
    steps:
      - name: Set up GitHub Packages authentication
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@arduano'
      - name: Download immutable release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p2prpc-release-candidate-${{ github.sha }}
          path: release-artifact
      - name: Verify release manifest
        id: artifact
        shell: bash
        run: |
          (cd release-artifact && sha256sum --check SHA256SUMS)
          jq -e --arg commit "$GITHUB_SHA" --arg ref "$GITHUB_REF" '
            (keys | sort) == [
              "ciRunId", "commit", "distTag", "integrity", "package",
              "ref", "schemaVersion", "sha256", "tarball", "version"
            ] and
            .schemaVersion == 3 and
            .package == "@arduano/p2prpc-core" and
            .commit == $commit and
            .ref == $ref and
            .ref == ("refs/tags/v" + .version) and
            .distTag == (if (.version | contains("-")) then "next" else "latest" end) and
            (.ciRunId | test("^[1-9][0-9]*$")) and
            (.integrity | test("^sha512-[A-Za-z0-9+/]+={0,2}$")) and
            (.sha256 | test("^[0-9a-f]{64}$")) and
            .tarball == ("arduano-p2prpc-core-" + .version + ".tgz")
          ' release-artifact/manifest.json >/dev/null
          tarball="$(jq -er '.tarball' release-artifact/manifest.json)"
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - name: Attest immutable package bytes
        id: provenance
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v4.2.2
        with:
          subject-path: release-artifact/${{ steps.artifact.outputs.tarball }}
      - name: Preserve provenance bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2prpc-provenance-${{ github.sha }}
          path: ${{ steps.provenance.outputs.bundle-path }}
          if-no-files-found: error
          overwrite: true
          retention-days: 90
      - name: Publish or recover the exact registry candidate
        shell: bash
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tarball="$(jq -er '.tarball' release-artifact/manifest.json)"
          version="$(jq -er '.version' release-artifact/manifest.json)"
          dist_tag="$(jq -er '.distTag' release-artifact/manifest.json)"
          expected_integrity="$(jq -er '.integrity' release-artifact/manifest.json)"
          registry_dir="$RUNNER_TEMP/registry-candidate"
          mkdir -p "$registry_dir"
          verify_existing_candidate() {
            local response registry_integrity registry_tarball tags
            response="$(npm view "@arduano/p2prpc-core@$version" dist.integrity \
              --json --registry=https://npm.pkg.github.com 2> "$registry_dir/view-error.log")" || return 1
            registry_integrity="$(jq -er '.' <<< "$response")" || return 1
            [[ "$registry_integrity" == "$expected_integrity" ]] || {
              echo "Registry version exists with different integrity" >&2
              return 2
            }
            rm -f -- "$registry_dir"/*.tgz "$registry_dir/pack.json"
            npm pack "@arduano/p2prpc-core@$version" \
              --registry=https://npm.pkg.github.com \
              --ignore-scripts \
              --pack-destination "$registry_dir" \
              --json > "$registry_dir/pack.json" || return 1
            registry_tarball="$(jq -er '.[0].filename' "$registry_dir/pack.json")" || return 1
            cmp --silent "release-artifact/$tarball" "$registry_dir/$registry_tarball" || {
              echo "Registry tarball differs from the immutable release candidate" >&2
              return 2
            }
            tags="$(npm view '@arduano/p2prpc-core' dist-tags \
              --json --registry=https://npm.pkg.github.com 2> "$registry_dir/tags-error.log")" || return 1
            jq -e --arg tag "$dist_tag" --arg version "$version" '.[$tag] == $version' \
              <<< "$tags" >/dev/null || return 3
          }
          if verify_existing_candidate; then
            echo "Exact GitHub Package already exists"
          else
            existing_status=$?
            if (( existing_status == 2 || existing_status == 3 )); then exit 1; fi
            if ! grep -q 'E404' "$registry_dir/view-error.log"; then
              cat "$registry_dir/view-error.log" >&2
              exit 1
            fi
            npm ping --registry=https://npm.pkg.github.com >/dev/null
            set +e
            npm publish "release-artifact/$tarball" \
              --ignore-scripts \
              --access public \
              --registry=https://npm.pkg.github.com \
              --tag "$dist_tag" \
              2>&1 | tee "$registry_dir/publish.log"
            publish_status=${PIPESTATUS[0]}
            set -e
            if (( publish_status != 0 )); then
              recovered=false
              for (( attempt = 0; attempt < 12; attempt += 1 )); do
                if verify_existing_candidate; then
                  recovered=true
                  break
                else
                  status=$?
                  if (( status == 2 || status == 3 )); then exit 1; fi
                fi
                sleep 5
              done
              [[ "$recovered" == "true" ]] || exit "$publish_status"
              echo "Recovered an ambiguously acknowledged exact publication"
            fi
          fi

  verify-publication:
    name: Verify registry bytes and downstream install
    needs: [candidate, publish]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      attestations: read
      contents: read
      packages: read
    steps:
      - name: Set up GitHub Packages authentication
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com
          scope: '@arduano'
      - name: Download immutable release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p2prpc-release-candidate-${{ github.sha }}
          path: release-artifact
      - name: Download provenance bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p2prpc-provenance-${{ github.sha }}
          path: provenance
      - name: Verify publication
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd release-artifact && sha256sum --check SHA256SUMS)
          version="$(jq -er '.version' release-artifact/manifest.json)"
          tarball="$(jq -er '.tarball' release-artifact/manifest.json)"
          expected_integrity="$(jq -er '.integrity' release-artifact/manifest.json)"
          verification="$RUNNER_TEMP/publication"
          mkdir -p "$verification/consumer" "$verification/registry"
          found=false
          for (( attempt = 0; attempt < 12; attempt += 1 )); do
            if response="$(npm view "@arduano/p2prpc-core@$version" dist.integrity \
              --json --registry=https://npm.pkg.github.com 2>/dev/null)" &&
              registry_integrity="$(jq -er '.' <<< "$response")"; then
              found=true
              break
            fi
            sleep 5
          done
          [[ "$found" == "true" && "$registry_integrity" == "$expected_integrity" ]]
          npm pack "@arduano/p2prpc-core@$version" \
            --registry=https://npm.pkg.github.com \
            --ignore-scripts \
            --pack-destination "$verification/registry" \
            --json > "$verification/registry/pack.json"
          registry_tarball="$(jq -er '.[0].filename' "$verification/registry/pack.json")"
          cmp --silent "release-artifact/$tarball" "$verification/registry/$registry_tarball"
          cd "$verification/consumer"
          npm init --yes >/dev/null
          npm install \
            --ignore-scripts \
            --strict-allow-scripts \
            --strict-peer-deps \
            --fund=false \
            --audit=false \
            "@arduano/p2prpc-core@$version"
          node --input-type=module - <<'NODE'
          import assert from 'node:assert/strict';
          import * as core from '@arduano/p2prpc-core';
          import * as advanced from '@arduano/p2prpc-core/advanced';
          import * as testing from '@arduano/p2prpc-core/testing';
          assert.equal(typeof core.createP2PNode, 'function');
          assert.equal(typeof advanced.createAdvancedP2PNode, 'function');
          assert.equal(typeof testing.dangerouslyAllowInsecureSessions, 'function');
          NODE
          cd "$GITHUB_WORKSPACE"
          visibility="$(gh api "/users/${GITHUB_REPOSITORY_OWNER}/packages/npm/p2prpc-core" --jq '.visibility')"
          [[ "$visibility" == "public" ]] || {
            echo "::error::Set @arduano/p2prpc-core visibility to public in GitHub package settings, then rerun this workflow."
            exit 1
          }
          bundle="$(find provenance -type f -print -quit)"
          gh attestation verify "release-artifact/$tarball" \
            --bundle "$bundle" \
            --repo "$GITHUB_REPOSITORY" \
            --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/publish.yml" \
            --source-digest "$GITHUB_SHA" \
            --source-ref "$GITHUB_REF" \
            --deny-self-hosted-runners \
            --format json > "$verification/attestation-verification.json"
          jq -n \
            --arg package "@arduano/p2prpc-core@$version" \
            --arg registry "https://npm.pkg.github.com" \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" \
            --arg integrity "$expected_integrity" \
            --arg sha256 "$(sha256sum "release-artifact/$tarball" | awk '{ print $1 }')" \
            --slurpfile attestation "$verification/attestation-verification.json" \
            '{
              schemaVersion: 1,
              package: $package,
              registry: $registry,
              commit: $commit,
              ref: $ref,
              integrity: $integrity,
              sha256: $sha256,
              attestation: $attestation[0]
            }' > "$verification/publication-verification.json"
      - name: Upload publication verification
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2prpc-publication-verification-${{ github.sha }}
          path: |
            ${{ runner.temp }}/publication/attestation-verification.json
            ${{ runner.temp }}/publication/publication-verification.json
          if-no-files-found: error
          overwrite: true
          retention-days: 90

  github-release:
    name: Create GitHub release
    needs: [candidate, publish, verify-publication]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download immutable release candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p2prpc-release-candidate-${{ github.sha }}
          path: release-artifact
      - name: Download provenance bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p2prpc-provenance-${{ github.sha }}
          path: provenance
      - name: Download publication verification
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p2prpc-publication-verification-${{ github.sha }}
          path: publication-verification
      - name: Create or recover exact GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          (cd release-artifact && sha256sum --check SHA256SUMS)
          version="$(jq -er '.version' release-artifact/manifest.json)"
          tarball="$(jq -er '.tarball' release-artifact/manifest.json)"
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
          jq -e \
            --arg package "@arduano/p2prpc-core@$version" \
            --arg commit "$GITHUB_SHA" \
            --arg ref "$GITHUB_REF" '
              .schemaVersion == 1 and
              .package == $package and
              .registry == "https://npm.pkg.github.com" and
              .commit == $commit and
              .ref == $ref and
              (.attestation | type == "array" and length >= 1)
            ' publication-verification/publication-verification.json >/dev/null
          bundle="$(find provenance -type f -print -quit)"
          title="@arduano/p2prpc-core $version"
          assets=(
            release-artifact/SHA256SUMS
            release-artifact/manifest.json
            release-artifact/pack.json
            "release-artifact/$tarball"
            release-artifact/sbom.cdx.json
            release-artifact/registry-signatures.json
            "$bundle"
            publication-verification/attestation-verification.json
            publication-verification/publication-verification.json
          )
          if existing="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" 2>/dev/null)"; then
            expected_prerelease=false
            if [[ "$version" == *-* ]]; then expected_prerelease=true; fi
            jq -e \
              --arg tag "$GITHUB_REF_NAME" \
              --arg title "$title" \
              --argjson prerelease "$expected_prerelease" '
                .tag_name == $tag and
                .name == $title and
                .draft == false and
                .prerelease == $prerelease
            ' <<< "$existing" >/dev/null
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
          else
            args=(--verify-tag --title "$title" --generate-notes)
            if [[ "$version" == *-* ]]; then args+=(--prerelease); fi
            gh release create "$GITHUB_REF_NAME" "${assets[@]}" "${args[@]}"
          fi
          expected_assets="$(printf '%s\n' "${assets[@]}" |
            while IFS= read -r asset; do basename "$asset"; done | jq -R . | jq -s 'sort')"
          release="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}")"
          jq -e --argjson expected "$expected_assets" '
            ([.assets[].name] | sort) == $expected and
            ([.assets[].name] | length) == ([.assets[].name] | unique | length)
          ' <<< "$release" >/dev/null
          download_dir="$RUNNER_TEMP/github-release-assets"
          mkdir -p "$download_dir"
          gh release download "$GITHUB_REF_NAME" --dir "$download_dir"
          for asset in "${assets[@]}"; do
            cmp --silent "$asset" "$download_dir/$(basename "$asset")" || {
              echo "GitHub release asset differs from verified source: $(basename "$asset")" >&2
              exit 1
            }
          done
