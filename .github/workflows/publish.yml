name: Publish to npm

on:
  workflow_dispatch:
    inputs:
      tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options: [latest, next]

concurrency:
  group: npm-publish
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    name: Publish current package version
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: npm
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        run: npm ci
      - name: Validate release
        run: npm run lint && npm run typecheck && npm test && npm run test:integration && npm run build
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - name: Read package version
        id: package
        shell: bash
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Publish with provenance
        run: npm publish -w @p2prpc/core --access public --provenance --tag "${{ inputs.tag }}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.package.outputs.tag }}
          RELEASE_VERSION: ${{ steps.package.outputs.version }}
        run: |
          release_args=(
            --target "$GITHUB_SHA"
            --title "@p2prpc/core $RELEASE_VERSION"
            --generate-notes
          )
          if [[ "${{ inputs.tag }}" == "next" ]]; then
            release_args+=(--prerelease)
          fi
          gh release create "$RELEASE_TAG" "${release_args[@]}"
