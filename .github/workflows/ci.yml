name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies without undeclared lifecycle scripts
        run: npm ci --strict-allow-scripts
      - name: Validate GitHub Actions workflows
        shell: bash
        run: bash scripts/check-github-actions.sh
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Check documentation links
        run: npm run check:docs
      - name: Test production evidence contract
        run: bash scripts/test-lab-driver-validation.sh
      - name: Run unit and security tests
        run: npm test
      - name: Build package
        run: npm run build
      - name: Create exact package artifact
        id: package
        shell: bash
        run: |
          artifact_directory="$RUNNER_TEMP/npm-artifact"
          npm run pack:artifact -- "$artifact_directory"
          tarball="$(jq -er '.[0].filename' "$artifact_directory/pack.json")"
          echo "artifact=$artifact_directory/$tarball" >> "$GITHUB_OUTPUT"
          echo "metadata=$artifact_directory/pack.json" >> "$GITHUB_OUTPUT"
      - name: Enforce package content and license policy
        run: npm run check:package-content -- "${{ steps.package.outputs.artifact }}" "${{ steps.package.outputs.metadata }}"
      - name: Lint packed package metadata
        run: npm run check:package-publint -- "${{ steps.package.outputs.artifact }}"
      - name: Validate packed TypeScript resolution
        run: npm run check:package-types -- "${{ steps.package.outputs.artifact }}"
      - name: Exercise an install-script-free packed consumer
        run: npm run test:packed -- "${{ steps.package.outputs.artifact }}"
      - name: Generate and validate runtime SBOM and registry signatures
        run: >-
          npm run generate:release-sbom --
          "${{ steps.package.outputs.artifact }}"
          "$RUNNER_TEMP/npm-artifact/sbom.cdx.json"
          "$RUNNER_TEMP/npm-artifact/registry-signatures.json"
      - name: Build documentation
        run: npm run docs:build
      - name: Audit dependencies
        run: npm audit --audit-level=low

  native:
    name: Native / ${{ matrix.os }} / Node ${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node: 20
          - os: ubuntu-22.04
            node: 22
          - os: ubuntu-22.04
            node: 24
          - os: macos-14
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      NAPI_RS_ENFORCE_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies without undeclared lifecycle scripts
        run: npm ci --strict-allow-scripts
      - name: Run unit and security tests
        run: npm test
      - name: Run native Iroh integration tests
        run: npm run test:integration
      - name: Build and pack the consumer artifact
        run: npm run build && npm run pack:artifact -- package-artifact
      - name: Exercise the tree-shaken packed native boundary
        run: npm run test:tree-shaken-native -- package-artifact

  minimum-runtime:
    name: Minimum runtime / Node 20.3.1
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up maintainer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies without undeclared lifecycle scripts
        run: npm ci --strict-allow-scripts
      - name: Build package
        run: npm run build
      - name: Pack the minimum-runtime artifact
        run: npm run pack:artifact -- package-artifact
      - name: Set up minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.3.1
      - name: Exercise the published runtime boundary
        run: npm run test:minimum-runtime && npm run test:packed -- package-artifact
