name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and package
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Pin reviewed npm pack version
        run: npm install --global npm@11.17.0
      - name: Install dependencies without undeclared lifecycle scripts
        run: npm ci --strict-allow-scripts
      - name: Validate GitHub Actions workflows
        shell: bash
        run: bash scripts/check-github-actions.sh
      - name: Validate release package identity and tag contract
        shell: bash
        run: |
          version="$(node -p "require('./packages/core/package.json').version")"
          npm run check:release-tag -- "refs/tags/v$version"
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Check documentation links
        run: npm run check:docs
      - name: Test production evidence contract
        run: bash scripts/test-lab-driver-validation.sh
      - name: Run unit and security tests
        run: npm test
      - name: Verify candidate and published package admission boundaries
        run: npm run test:consumer-preparation
      - name: Build package
        run: npm run build
      - name: Install Chromium for the real browser bridge journey
        run: npx playwright-core install --with-deps chromium
      - name: Run browser / WSS / Iroh bridge qualification
        run: npm run test:browser -w @arduano/p2prpc-core
      - name: Create exact package artifact
        id: package
        shell: bash
        run: |
          artifact_directory="$RUNNER_TEMP/npm-artifact"
          npm run pack:artifact -- "$artifact_directory"
          tarball="$(jq -er '.[0].filename' "$artifact_directory/pack.json")"
          echo "artifact=$artifact_directory/$tarball" >> "$GITHUB_OUTPUT"
          echo "metadata=$artifact_directory/pack.json" >> "$GITHUB_OUTPUT"
          echo "directory=$artifact_directory" >> "$GITHUB_OUTPUT"
      - name: Enforce package content and license policy
        run: npm run check:package-content -- "${{ steps.package.outputs.artifact }}" "${{ steps.package.outputs.metadata }}"
      - name: Lint packed package metadata
        run: npm run check:package-publint -- "${{ steps.package.outputs.artifact }}"
      - name: Validate packed TypeScript resolution
        run: npm run check:package-types -- "${{ steps.package.outputs.artifact }}"
      - name: Prepare the exact source-candidate Iroh consumer
        run: npm run prepare:candidate-consumer -- "${{ steps.package.outputs.directory }}" "${{ runner.temp }}/candidate-consumer"
      - name: Exercise an install-script-free packed consumer
        run: npm run test:packed -- "${{ runner.temp }}/candidate-consumer"
      - name: Retain the actual native-closure SBOM and registry signatures
        shell: bash
        run: |
          cp "$RUNNER_TEMP/candidate-consumer/candidate-consumer-receipt.json" "$RUNNER_TEMP/npm-artifact/"
          cp "$RUNNER_TEMP/candidate-consumer/candidate-consumer-sbom.cdx.json" "$RUNNER_TEMP/npm-artifact/"
          cp "$RUNNER_TEMP/candidate-consumer/candidate-consumer-registry-signatures.json" "$RUNNER_TEMP/npm-artifact/"
      - name: Share the exact source candidate with native jobs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: p2prpc-source-candidate-package-${{ github.sha }}
          path: ${{ runner.temp }}/npm-artifact/
          if-no-files-found: error
          retention-days: 7
      - name: Build documentation
        run: npm run docs:build
      - name: Audit dependencies
        run: npm audit --audit-level=low

  native:
    name: Native / ${{ matrix.os }} / Node ${{ matrix.node }}
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            node: 20
          - os: ubuntu-22.04
            node: 22
          - os: ubuntu-22.04
            node: 24
          - os: windows-latest
            node: 24
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      NAPI_RS_ENFORCE_VERSION_CHECK: "1"
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - name: Install dependencies without undeclared lifecycle scripts
        run: npm ci --strict-allow-scripts
      - name: Run unit and security tests
        run: npm test
      - name: Run native Iroh integration tests
        run: npm run test:integration
      - name: Build package on target Node.js
        run: npm run build
      - name: Download exact source-candidate package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p2prpc-source-candidate-package-${{ github.sha }}
          path: package-artifact
      - name: Prepare the exact source-candidate Iroh consumer
        run: npm run prepare:candidate-consumer -- package-artifact "${{ runner.temp }}/candidate-consumer"
      - name: Exercise the tree-shaken packed native boundary
        run: npm run test:tree-shaken-native -- "${{ runner.temp }}/candidate-consumer"

  minimum-runtime:
    name: Minimum runtime / Node 20.3.1
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up maintainer Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.19.0
          cache: npm
      - name: Pin reviewed npm pack version
        run: npm install --global npm@11.17.0
      - name: Install dependencies without undeclared lifecycle scripts
        run: npm ci --strict-allow-scripts
      - name: Build workspace for minimum-runtime imports
        run: npm run build
      - name: Download exact source-candidate package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: p2prpc-source-candidate-package-${{ github.sha }}
          path: package-artifact
      - name: Prepare the exact source-candidate Iroh consumer
        run: npm run prepare:candidate-consumer -- package-artifact "$RUNNER_TEMP/candidate-consumer"
      - name: Set up minimum supported Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20.3.1
      - name: Exercise the minimum source and candidate-package runtime boundaries
        run: npm run test:minimum-runtime && npm run test:packed -- "$RUNNER_TEMP/candidate-consumer"
